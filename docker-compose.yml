services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
      POSTGRES_DB: transit
    ports:
      - "5434:5432"  # host 5434: 5432 is a local Postgres, 5433 another project's container
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://transit:transit@db:5432/transit
      # Read from .env by Compose. Empty means no key: Los Angeles shows timetables only.
      LA_METRO_API_KEY: ${LA_METRO_API_KEY:-}
      LA_METRO_API_KEY_HEADER: ${LA_METRO_API_KEY_HEADER:-Authorization}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: python -m app.worker.scheduler
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./web
    ports:
      - "8080:80"  # website at http://localhost:8080; nginx forwards /api and /health to api
    depends_on:
      - api

volumes:
  pgdata:
