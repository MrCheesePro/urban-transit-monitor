server {
    listen 80;
    root /usr/share/nginx/html;

    # API calls and health checks go to the FastAPI container, so the browser only talks to one origin.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Built files have a content hash in their name and never change, so browsers may keep them a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other address is a page of the React app: serve index.html and let the router pick the page.
    location / {
        try_files $uri /index.html;
    }
}
